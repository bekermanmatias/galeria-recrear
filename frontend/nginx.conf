server {
    listen 80;
    server_name _;
    # La API recibe fotos y videos originales a traves de este proxy.
    # Debe coincidir con MAX_VIDEO_FILE_SIZE_MB del backend y con el Nginx público.
    client_max_body_size 1g;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Las páginas Astro referencian bundles con hash. Nunca conservar HTML de
    # una versión anterior: de hacerlo, el navegador pediría assets ya
    # eliminados por el siguiente despliegue y la hidratación fallaría con 404.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Los archivos bajo _astro sí contienen hash de contenido, por lo que son
    # seguros de guardar indefinidamente y no mezclan versiones entre deploys.
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # El enlace publico conserva el token y usa una pagina estatica comun.
    location /colegio/ {
        try_files $uri $uri/ /colegio/index.html;
    }

    # Todas las rutas dirigen a index.html (necesario para SPA/Astro routers)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirigir peticiones API al backend interno (evita abrir puertos extras en el VPS)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        # Los videos pueden llegar a 1 GB. Transmitirlos al backend a medida
        # que llegan evita conservar una segunda copia completa en el disco
        # temporal de Nginx, que en producción vive en el contenedor.
        proxy_request_buffering off;
        # La reproducción usa HTTP Range; no acumular la respuesta completa
        # permite que el navegador reciba metadata y segmentos enseguida.
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;
        send_timeout 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché optimizada para archivos estáticos (imágenes, CSS, JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
