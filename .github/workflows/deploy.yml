name: Deploy to Production (Hostinger VPS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_BACKEND: ${{ secrets.PROD_ENV_BACKEND }}
          ENV_FRONTEND: ${{ secrets.PROD_ENV_FRONTEND }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          envs: ENV_BACKEND,ENV_FRONTEND,PROJECT_PATH
          script: |
            set -eu
            : "${PROJECT_PATH:?Configurá el secreto PROJECT_PATH con la ruta absoluta del proyecto en el VPS.}"
            if [ ! -d "$PROJECT_PATH" ]; then
              echo "PROJECT_PATH no existe en el VPS. Actualizá ese secreto con la ruta absoluta del proyecto."
              exit 1
            fi
            cd "$PROJECT_PATH"
            
            echo "1. Pulling latest code..."
            git pull origin main
            
            echo "2. Configurando archivos .env..."
            echo "$ENV_BACKEND" > backend/.env
            echo "$ENV_FRONTEND" > frontend/.env
            
            echo "3. Reconstruyendo y reiniciando contenedores con Docker Compose..."
            ATTEMPT=1
            MAX_ATTEMPTS=3
            until docker-compose -f docker-compose.prod.yml up -d --build; do
              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "El despliegue falló luego de $MAX_ATTEMPTS intentos."
                exit 1
              fi

              echo "Falló el intento $ATTEMPT/$MAX_ATTEMPTS. Reintentando en 10 segundos..."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 10
            done
            
            echo "¡Deploy completado exitosamente!"
